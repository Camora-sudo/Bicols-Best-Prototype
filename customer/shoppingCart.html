<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bicol's Best - Shopping Cart</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">
    
    <style>
        body { font-family: sans-serif; background-color: #F5F6F5; }
        .brand-text { font-family: serif; }
    </style>
</head>

<body class="text-black min-h-screen relative pb-20">

    <!-- Navbar Placeholder -->
    <div id="navbar-placeholder"></div>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto py-10 px-4">
        <h2 class="text-3xl font-bold text-center mb-8 tracking-wide">Your Shopping Cart</h2>
        
        <div class="bg-white shadow-lg rounded-b-lg">
            
            <div class="grid grid-cols-12 gap-4 px-8 py-4 border-b-2 border-black font-bold text-[15px]">
                <div class="col-span-5">Product</div>
                <div class="col-span-2 text-center">Unit Price</div>
                <div class="col-span-3 text-center">Quantity</div>
                <div class="col-span-2 text-center">Subtotal</div>
            </div>

            <div id="cart-items" class="px-8 min-h-[150px]">
                </div>

            <div class="p-8 border-t-2 border-gray-100 bg-gray-50 flex justify-end rounded-b-lg">
                <div class="bg-white shadow-md border border-gray-200 p-6 w-full md:w-[350px] rounded-lg">
                    <div class="flex justify-between items-center font-bold text-[18px] mb-4">
                        <span>Total:</span>
                        <span id="cart-total" class="text-[#8A1C14]">0.00 ₱</span>
                    </div>
                    
                    <div id="moq-warning-container"></div>

                    <button onclick="window.location.href='checkout.html'" id="checkout-btn" class="w-full bg-[#751A1A] hover:bg-[#5a1414] text-white font-bold py-3 rounded-full transition-colors shadow-sm mt-2">
                        Proceed to Checkout
                    </button>
                </div>
            </div>

        </div>
    </main>

    <script src="../navbar.js"></script>
    <script>

        // Cart Logic
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        const currentRole = localStorage.getItem('role') || 'user';

        function renderCart() {
            const cartContainer = document.getElementById('cart-items');
            cartContainer.innerHTML = '';
            let totalPrice = 0;
            let totalQty = 0; // The crucial tracking variable for the 48 item rule!

            if (cart.length === 0) {
                cartContainer.innerHTML = '<div class="py-12 text-center text-gray-500 font-medium text-lg italic">Your cart is empty. <br><a href="productCatalogue.html" class="text-[#8A1C14] hover:underline mt-2 inline-block not-italic">Browse Products</a></div>';
                document.getElementById('cart-total').innerText = '0.00 ₱';
                updateCheckoutButton(0);
                return;
            }

            cart.forEach((item, index) => {
                const subtotal = item.price * item.quantity;
                totalPrice += subtotal;
                totalQty += item.quantity; 
                
                const borderClass = index !== cart.length - 1 ? 'border-b border-gray-400' : '';

                const itemHTML = `
                    <div class="cart-item grid grid-cols-12 gap-4 items-center py-6 ${borderClass}">
                        <div class="col-span-5 flex items-center gap-4">
                            <div class="w-20 h-24 bg-gray-100 p-1 border border-gray-200 flex-shrink-0 shadow-sm">
                                <img src="${item.img}" alt="${item.name}" onerror="this.src='../images/logo.png'" class="w-full h-full object-cover" />
                            </div>
                            <span class="font-bold text-sm pr-4 leading-tight">${item.name}</span>
                        </div>
                        <div class="col-span-2 text-center font-bold text-[#8A1C14]">${item.price.toFixed(2)} ₱</div>
                        <div class="col-span-3 flex justify-center">
                            <div class="flex items-center gap-2 border-[1.5px] border-black rounded-full px-4 py-1.5 w-32 justify-between">
                                <button onclick="updateQuantity(${item.id}, -1)" class="hover:text-gray-500"><i data-lucide="minus" class="w-4 h-4 stroke-[3]"></i></button>
                                <input type="number" value="${item.quantity}" onchange="setQuantity(${item.id}, this.value)" class="w-10 text-center font-medium text-sm bg-transparent outline-none focus:ring-0 m-0 p-0" min="1">
                                <button onclick="updateQuantity(${item.id}, 1)" class="hover:text-gray-500"><i data-lucide="plus" class="w-4 h-4 stroke-[3]"></i></button>
                            </div>
                        </div>
                        <div class="col-span-2 flex items-center justify-between pr-4">
                            <span class="font-bold text-[#8A1C14]">${subtotal.toFixed(2)} ₱</span>
                            <button onclick="removeItem(${item.id})" class="text-black hover:text-red-600 transition-colors"><i data-lucide="x" class="w-7 h-7 stroke-[2.5]"></i></button>
                        </div>
                    </div>
                `;
                cartContainer.insertAdjacentHTML('beforeend', itemHTML);
            });

            document.getElementById('cart-total').innerText = totalPrice.toFixed(2) + ' ₱';
            updateCheckoutButton(totalQty);
            lucide.createIcons();
        }

        // --- STRICT CHECKOUT ENFORCEMENT ---
        function updateCheckoutButton(totalQty) {
            const checkoutBtn = document.getElementById('checkout-btn');
            const warningContainer = document.getElementById('moq-warning-container');
            
            warningContainer.innerHTML = ''; // Clear existing warnings

            if (totalQty === 0) {
                checkoutBtn.disabled = true;
                checkoutBtn.className = 'w-full bg-gray-400 text-gray-200 font-medium py-3 rounded-full cursor-not-allowed shadow-sm mt-2';
            } else if (currentRole === 'reseller' && totalQty < 48) {
                checkoutBtn.disabled = true;
                checkoutBtn.className = 'w-full bg-gray-400 text-gray-200 font-medium py-3 rounded-full cursor-not-allowed shadow-sm';
                
                // The mb-3 here physically pushes the button down to prevent overlap
                warningContainer.innerHTML = `
                    <div class="text-red-600 text-[13px] font-bold text-center leading-tight mb-3">
                        Reseller MOQ not met!<br/>You need ${48 - totalQty} more items.
                    </div>
                `;
            } else {
                checkoutBtn.disabled = false;
                checkoutBtn.className = 'w-full bg-[#751A1A] hover:bg-[#5a1414] text-white font-medium py-3 rounded-full transition-colors shadow-sm mt-2';
            }
        }

        function updateQuantity(id, change) {
            const itemIndex = cart.findIndex(item => item.id === id);
            if (itemIndex > -1) {
                const newQty = cart[itemIndex].quantity + change;
                if (newQty >= 1) {
                    cart[itemIndex].quantity = newQty;
                    localStorage.setItem('cart', JSON.stringify(cart));
                    renderCart();
                }
            }
        }

        // Function for typing the number manually
        function setQuantity(id, newValue) {
            const itemIndex = cart.findIndex(item => item.id === id);
            if (itemIndex > -1) {
                let newQty = parseInt(newValue);
                if (isNaN(newQty) || newQty < 1) newQty = 1; 
                
                cart[itemIndex].quantity = newQty;
                localStorage.setItem('cart', JSON.stringify(cart));
                renderCart();
            }
        }

        function removeItem(id) {
            cart = cart.filter(item => item.id !== id);
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderCart();
        });
    </script>
</body>
</html>
