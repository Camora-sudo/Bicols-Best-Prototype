<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bicol's Best - Checkout</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">
    
    <style>
        body { font-family: sans-serif; background-color: #F5F6F5; }
        .brand-text { font-family: serif; }
        /* Custom styled radio buttons */
        input[type="radio"] {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 2.5px solid black;
            border-radius: 50%;
            margin-right: 12px;
            display: grid;
            place-content: center;
            cursor: pointer;
        }
        input[type="radio"]::before {
            content: "";
            width: 10px;
            height: 10px;
            border-radius: 50%;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em #8A1C14;
        }
        input[type="radio"]:checked {
            border-color: #8A1C14;
        }
        input[type="radio"]:checked::before {
            transform: scale(1);
        }
    </style>
</head>
<body class="text-black min-h-screen">

    <!-- Navbar Placeholder -->
    <div id="navbar-placeholder"></div>

    <!-- Main Content Area -->
    <main class="max-w-5xl mx-auto py-10 px-4 relative">
        <a href="shoppingCart.html" class="absolute top-10 left-4 text-sm font-bold text-[#8A1C14] hover:underline flex items-center gap-1">
            &larr; Back to Cart
        </a>
        <h2 class="text-3xl font-bold text-center mb-8 tracking-wide mt-8">Checkout & Payment</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <!-- Left Column: Forms -->
            <div class="flex flex-col gap-6">
                
                <!-- Delivery Option Card -->
                <div class="bg-white shadow-lg p-8 h-[370px]">
                    <h3 class="font-bold text-lg mb-6 uppercase text-black">DELIVERY OPTION</h3>
                    
                    <div class="flex flex-col gap-4 mb-6 font-bold text-[15px] text-[#8A1C14]">
                        <label class="flex items-start gap-3 cursor-pointer">
                            <input type="radio" name="delivery_mode" value="pickup" onchange="toggleDelivery()">
                            <div class="flex flex-col -mt-1">
                                <span>STORE PICKUP</span>
                                <span class="italic text-sm font-normal text-[#8A1C14]">Address.........</span>
                            </div>
                        </label>
                        
                        <label class="flex items-center gap-3 cursor-pointer">
                            <input type="radio" name="delivery_mode" value="delivery" checked onchange="toggleDelivery()">
                            <span>DELIVERY</span>
                        </label>
                    </div>

                    <!-- Delivery Form Fields -->
                    <div class="flex flex-col gap-3">
                        <input type="text" id="address" placeholder="SHIPPING ADDRESS" class="w-full border-[2px] border-black p-2 font-bold text-[#8A1C14] placeholder-[#8A1C14] text-sm focus:outline-none focus:border-[#751A1A]" />
                        <div class="grid grid-cols-2 gap-3">
                            <input type="text" id="name" placeholder="NAME" class="w-full border-[2px] border-black p-2 font-bold text-[#8A1C14] placeholder-[#8A1C14] text-sm focus:outline-none focus:border-[#751A1A]" />
                            <input type="email" id="email" placeholder="EMAIL" class="w-full border-[2px] border-black p-2 font-bold text-[#8A1C14] placeholder-[#8A1C14] text-sm focus:outline-none focus:border-[#751A1A]" />
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <input type="text" id="number" placeholder="NUMBER" class="w-full border-[2px] border-black p-2 font-bold text-[#8A1C14] placeholder-[#8A1C14] text-sm focus:outline-none focus:border-[#751A1A]" />
                            <input type="text" id="postal" placeholder="POSTAL CODE" class="w-full border-[2px] border-black p-2 font-bold text-[#8A1C14] placeholder-[#8A1C14] text-sm focus:outline-none focus:border-[#751A1A]" />
                        </div>
                        <p id="error-msg" class="text-red-500 text-[11px] font-bold mt-1 hidden">* Please fill out all required fields.</p>
                    </div>
                </div>

                <!-- Payment Method Card -->
                <div class="bg-white shadow-lg p-8">
                    <h3 class="font-bold text-lg mb-6 uppercase text-black">PAYMENT METHOD</h3>
                    
                    <div class="flex flex-col gap-4 font-bold text-[15px] text-[#8A1C14]">
                        <label class="flex items-center gap-3 cursor-pointer">
                            <input type="radio" name="payment_mode" value="cod" checked>
                            <span>CASH ON DELIVERY</span>
                        </label>
                        
                        <label class="flex items-center gap-3 cursor-pointer">
                            <input type="radio" name="payment_mode" value="ewallet">
                            <span>E-WALLET/CARD ETC...</span>
                        </label>
                    </div>
                </div>
                
            </div>

            <!-- Right Column - Order Summary -->
            <div class="bg-white shadow-lg p-8 relative flex flex-col h-[370px]">
                <h3 class="font-bold text-lg mb-6 uppercase text-black">ORDER SUMMARY</h3>
                
                <div class="flex flex-col gap-3 font-bold text-[15px] mb-8 text-black">
                    <div class="flex justify-between">
                        <span>Subtotal :</span>
                        <span id="summary-subtotal">0.00 ₱</span>
                    </div>
                    <div class="flex justify-between">
                        <span>Shipping :</span>
                        <span id="shipping-fee">50.00 ₱</span>
                    </div>
                    
                    <div class="border-t-[3px] border-gray-400 my-4"></div>
                    
                    <div class="flex justify-between text-lg">
                        <span>Total :</span>
                        <span id="total-price">0.00 ₱</span>
                    </div>
                </div>

                <button onclick="placeOrder()" class="absolute bottom-8 right-8 bg-[#8A1C14] hover:bg-[#6b150f] text-white font-bold px-8 py-3 rounded-full transition-colors shadow-md uppercase tracking-wide text-lg">
                    PLACE ORDER
                </button>
            </div>

        </div>
    </main>

    <!-- Success Modal Overlay -->
    <div id="success-modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50">
        <div class="bg-white p-12 text-center shadow-xl rounded-lg max-w-lg mx-4">
            <h2 class="text-3xl font-bold text-[#8A1C14] mb-4">Order Placed Successfully!</h2>
            <p class="mb-8 font-medium text-gray-700">Thank you for ordering with Bicol's Best.</p>
            <button onclick="clearCartAndReturn()" class="bg-[#751A1A] hover:bg-[#5a1414] text-white px-8 py-3 rounded-full font-bold transition-colors shadow-sm">
                Return to Shop
            </button>
        </div>
    </div>

    <script src="../navbar.js"></script>
    <script>
        lucide.createIcons();


        let cartSubtotal = 0;
        let deliveryFee = 50.00;

        document.addEventListener('DOMContentLoaded', () => {
            const currentRole = localStorage.getItem('role') || 'user';
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            
            // --- STRICT FINAL CHECKOUT GUARD ---
            const totalQty = cart.reduce((sum, item) => sum + item.quantity, 0);

            if (totalQty === 0) {
                alert("Your cart is empty. Redirecting to shopping cart.");
                window.location.href = 'shoppingCart.html';
                return; // Stop the page from continuing to load
            }

            if (currentRole === 'reseller' && totalQty < 48) {
                alert("Reseller Warning: You do not meet the 48 item Minimum Order Quantity. Redirecting to cart.");
                window.location.href = 'shoppingCart.html';
                return; // Stop the page from continuing to load
            }
            // ------------------------------------

            cartSubtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            document.getElementById('summary-subtotal').innerText = cartSubtotal.toFixed(2) + ' ₱';
            updateTotals();
        });

        function updateTotals() {
            const totalPrice = cartSubtotal + deliveryFee;
            document.getElementById('shipping-fee').innerText = deliveryFee.toFixed(2) + ' ₱';
            document.getElementById('total-price').innerText = totalPrice.toFixed(2) + ' ₱';
        }

        function toggleDelivery() {
            const isDelivery = document.querySelector('input[name="delivery_mode"]:checked').value === 'delivery';
            const addressInput = document.getElementById('address');
            const postalInput = document.getElementById('postal');
            
            if (isDelivery) {
                addressInput.disabled = false; postalInput.disabled = false;
                addressInput.classList.remove('opacity-50', 'bg-gray-100'); postalInput.classList.remove('opacity-50', 'bg-gray-100');
                addressInput.placeholder = "SHIPPING ADDRESS"; postalInput.placeholder = "POSTAL CODE";
                deliveryFee = 50.00;
            } else {
                addressInput.disabled = true; postalInput.disabled = true;
                addressInput.classList.add('opacity-50', 'bg-gray-100'); postalInput.classList.add('opacity-50', 'bg-gray-100');
                addressInput.placeholder = "N/A (STORE PICKUP)"; postalInput.placeholder = "N/A";
                addressInput.style.borderColor = "black"; postalInput.style.borderColor = "black";
                deliveryFee = 0.00;
            }
            updateTotals();
        }

        function placeOrder() {
            const name = document.getElementById('name');
            const email = document.getElementById('email');
            const number = document.getElementById('number');
            const address = document.getElementById('address');
            const postal = document.getElementById('postal');
            const errorMsg = document.getElementById('error-msg');
            const isDelivery = document.querySelector('input[name="delivery_mode"]:checked').value === 'delivery';

            let isValid = true;
            
            const validateField = (field) => {
                if (field.value.trim() === '') {
                    field.style.borderColor = 'red';
                    field.style.backgroundColor = '#FEF2F2'; // red-50
                    isValid = false;
                } else {
                    field.style.borderColor = 'black';
                    field.style.backgroundColor = 'white';
                }
            };

            validateField(name);
            validateField(email);
            validateField(number);

            if (isDelivery) {
                validateField(address);
                validateField(postal);
            }

            if (!isValid) {
                errorMsg.classList.remove('hidden');
            } else {
                errorMsg.classList.add('hidden');
                saveOrder(isDelivery); 
                document.getElementById('success-modal').classList.remove('hidden');
                document.getElementById('success-modal').classList.add('flex');
            }
        }

        // NEW FUNCTION 
        function saveOrder(isDelivery) {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const paymentMode = document.querySelector('input[name="payment_mode"]:checked').value;
            const totalPrice = cartSubtotal + deliveryFee;

            const order = {
                id: 'order_' + Date.now(),
                displayId: '#' + Math.floor(1000 + Math.random() * 9000),
                date: new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }),
                status: 'Processing',
                deliveryMode: isDelivery ? 'Delivery' : 'Store Pickup',
                paymentMode: paymentMode === 'cod' ? 'Cash on Delivery' : 'E-Wallet/Card',
                customer: {
                    name: document.getElementById('name').value,
                    email: document.getElementById('email').value,
                    number: document.getElementById('number').value,
                    address: isDelivery ? document.getElementById('address').value : 'N/A (Store Pickup)',
                    postal: isDelivery ? document.getElementById('postal').value : 'N/A'
                },
                items: cart.map(item => ({
                    name: item.name,
                    price: item.price,
                    quantity: item.quantity,
                    img: item.img
                })),
                subtotal: cartSubtotal,
                shipping: deliveryFee,
                total: totalPrice
            };

            const orders = JSON.parse(localStorage.getItem('orders')) || [];
            orders.unshift(order); // newest first
            localStorage.setItem('orders', JSON.stringify(orders));
        }
        
        function clearCartAndReturn() {
            localStorage.removeItem('cart');
            window.location.href = 'productCatalogue.html';
        }

        document.querySelectorAll('input[type="text"], input[type="email"]').forEach(input => {
            input.addEventListener('input', function() {
                this.style.borderColor = 'black';
                this.style.backgroundColor = 'white';
            });
        });
    </script>
</body>
</html>
