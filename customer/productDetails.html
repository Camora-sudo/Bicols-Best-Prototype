<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bicol's Best - Product Details</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Remix Icon -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">

  <style>
    :root {
      --brand-red: #821b16;
      --brand-red-hover: #661410;
      --bg: #f8f9fa;
      --surface: #ffffff;
      --text: #1c1917;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --radius: 16px;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding-bottom: 60px;
    }

    .back-link {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 1.5rem;
    }
    .back-link:hover { color: var(--brand-red); }

    /* Outer Wrapper Card Container */
    .product-details-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2.5rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    }

    /* Inner Layout Grid */
    .detail-layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 3rem;
      align-items: start;
    }

    @media (max-width: 992px) {
      .product-details-container { padding: 1.5rem; }
      .detail-layout { grid-template-columns: 1fr; gap: 2rem; }
    }

    /* Inner Image Container */
    .image-box {
      background: #f9fafb;
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
      height: 380px;
    }
    .image-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    /* Content Area Styling */
    .brand-subtitle {
      font-size: 1.05rem;
      color: #1c1917;
      font-weight: 500;
      margin-bottom: 0.25rem;
    }

    .product-main-title {
      font-size: 2rem;
      font-weight: 800;
      color: #000000;
      line-height: 1.25;
      margin-bottom: 1.25rem;
    }

    .price-row {
      display: flex;
      align-items: baseline;
      gap: 1.25rem;
      margin-bottom: 1.5rem;
    }
    .price-amount {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--brand-red);
    }
    .stock-info {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-style: italic;
    }

    .qty-label {
      font-weight: 600;
      font-size: 1.05rem;
      margin-bottom: 0.5rem;
    }

    /* Action Controls */
    .action-row {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      margin-bottom: 2rem;
    }

    .quantity-control {
      display: flex;
      align-items: center;
      border: 2px solid #000000;
      border-radius: 999px;
      padding: 2px 12px;
      width: 150px;
      justify-content: space-between;
      height: 48px;
    }
    .qty-btn {
      background: transparent;
      border: none;
      font-size: 1.3rem;
      font-weight: 600;
      cursor: pointer;
      color: #000000;
      padding: 0 6px;
    }
    .qty-input {
      width: 40px;
      text-align: center;
      border: none;
      font-weight: 700;
      font-size: 1.1rem;
      background: transparent;
    }

    .add-to-cart-btn {
      background: var(--brand-red);
      color: white;
      border: none;
      padding: 0 2rem;
      height: 48px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .add-to-cart-btn:hover { background: var(--brand-red-hover); }

    /* SKU & Spec details */
    .sku-block {
      font-size: 1.05rem;
      font-weight: 600;
      color: #000000;
      margin-bottom: 0.35rem;
    }
    .spec-block {
      font-size: 1.05rem;
      font-weight: 500;
      color: #000000;
      margin-bottom: 2rem;
    }

    /* Italicized Description */
    .product-description {
      font-size: 1.1rem;
      font-style: italic;
      line-height: 1.6;
      color: #1c1917;
      margin-bottom: 2rem;
    }

    .reviews-link {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--brand-red);
      text-decoration: underline;
      cursor: pointer;
    }

    /* Toast Notification */
    .toast-msg {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #10B981;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      box-shadow: 0 10px 15px rgba(0,0,0,0.1);
      display: none;
      z-index: 1000;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <div id="navbar-container"></div>

  <main class="container my-4">
    <a href="productCatalogue.html" class="back-link"><i class="ri-arrow-left-line"></i> Back to Products</a>

    <!-- Product Details Card Container -->
    <div class="product-details-container">
      <div class="detail-layout" id="productContainer">
        <!-- Dynamic Content Populated by JS -->
      </div>
    </div>
  </main>

  <div id="toast" class="toast-msg">Added to cart successfully!</div>

  <script>
    // Load external navbar HTML
    fetch('navbar.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('navbar-container').innerHTML = data;
        const scripts = document.getElementById('navbar-container').getElementsByTagName('script');
        for (let i = 0; i < scripts.length; i++) {
          eval(scripts[i].innerText);
        }
      })
      .catch(err => console.error('Error loading navbar:', err));

    // Detailed Product Dataset
    const products = [
      {
        id: 1,
        brand: "Bicol's Best",
        name: "Bicol's Best Bicol Express Pork – 210g",
        price: 250,
        stock: 54320,
        moq: 50,
        sku: "BBST-BXPRK-210",
        specs: "210g | 7.4oz | UPC 0480901536200",
        desc: "Bicol's Best Bicol Express Pork is a savory and fiery classic made from choice pork cuts simmered slowly in rich coconut milk, fermented shrimp paste, and authentic Bicolano chili peppers.",
        img: "../images/BE_Pork.png"
      },
      {
        id: 2,
        brand: "Bicol's Best",
        name: "Bicol's Best Bicol Express Tinapa – 210g",
        price: 200,
        stock: 676767,
        moq: 50,
        sku: "BBST-BXTIN-210",
        specs: "210g | 7.4oz | UPC 04809015362013",
        desc: "Bicol's Best Bicol Express Tinapa is a rich and spicy blend of smoked fish cooked in creamy coconut milk with chili, delivering an authentic Bicolano flavor in every bite.",
        img: "../images/BE_Tinapa.png"
      },
      {
        id: 3,
        brand: "Bicol's Best",
        name: "Bicol's Best Laing Regular – 226g",
        price: 210,
        stock: 120400,
        moq: 50,
        sku: "BBST-LNGREG-226",
        specs: "226g | 8.0oz | UPC 04809015362020",
        desc: "Bicol's Best Laing Regular features tender dried taro leaves cooked in concentrated coconut milk with fresh spices, bringing a traditional homestyle Bicolano delicacy to your table.",
        img: "../images/Regular_Laing.png"
      },
      {
        id: 4,
        brand: "Bicol's Best",
        name: "Bicol's Best Laing Spicy – 226g",
        price: 210,
        stock: 98120,
        moq: 50,
        sku: "BBST-LNGSPC-226",
        specs: "226g | 8.0oz | UPC 04809015362037",
        desc: "Bicol's Best Laing Spicy blends selected dried taro leaves with rich coconut cream and an extra kick of native chili for spicy food enthusiasts.",
        img: "../images/Spicy_Laing.png"
      },
      {
        id: 5,
        brand: "Bicol's Best",
        name: "Bicol's Best Gulay na Santol Regular – 210g",
        price: 220,
        stock: 45000,
        moq: 50,
        sku: "BBST-GNSREG-220",
        specs: "210g | 7.4oz | UPC 04809015362044",
        desc: "Bicol's Best Gulay na Santol Regular (Sinantolan) combines finely grated santol pulp with thick coconut cream and spices for a perfectly balanced savory dish.",
        img: "../images/Regular_Santol.png"
      },
      {
        id: 6,
        brand: "Bicol's Best",
        name: "Bicol's Best Gulay na Santol Spicy – 210g",
        price: 220,
        stock: 32100,
        moq: 50,
        sku: "BBST-GNSSPC-220",
        specs: "210g | 7.4oz | UPC 04809015362051",
        desc: "Bicol's Best Gulay na Santol Spicy offers a uniquely sour, sweet, savory, and extra fiery profile using shredded santol fruit slow-cooked in coconut milk.",
        img: "../images/Spicy_Santol.png"
      },
      {
        id: 7,
        brand: "Bicol's Best",
        name: "Bicol's Best Bicol Chili Paste – 100g",
        price: 180,
        stock: 89000,
        moq: 50,
        sku: "BBST-CHLPST-100",
        specs: "100g | 3.53oz | UPC 04809015362068",
        desc: "Bicol's Best Bicol Chili Paste is crafted from fresh labuyo peppers and aromatic spices, delivering pure heat and rich flavor to any meal.",
        img: "../images/Chili_Paste.png"
      },
      {
        id: 8,
        brand: "Bicol's Best",
        name: "Bicol's Best Very Special Pinangat Regular – 240g",
        price: 280,
        stock: 15400,
        moq: 50,
        sku: "BBST-PNGREG-240",
        specs: "240g | 8.47oz | UPC 04809015362075",
        desc: "Bicol's Best Very Special Pinangat Regular features carefully layered taro leaves stuffed with seafood and pork, bound with thick coconut milk.",
        img: "../images/Regular_Pinangat.png"
      },
      {
        id: 9,
        brand: "Bicol's Best",
        name: "Bicol's Best Very Special Pinangat Spicy – 240g",
        price: 280,
        stock: 12300,
        moq: 50,
        sku: "BBST-PNGSPC-240",
        specs: "240g | 8.47oz | UPC 04809015362082",
        desc: "Bicol's Best Very Special Pinangat Spicy delivers an authentic Camalig Pinangat experience stuffed with fiery red chilies and rich coconut cream.",
        img: "../images/Spicy_Pinangat.png"
      }
    ];

    // Get Product ID from URL
    const urlParams = new URLSearchParams(window.location.search);
    const productId = parseInt(urlParams.get('id')) || 2;
    const product = products.find(p => p.id === productId) || products[1];

    function renderDetail() {
      const container = document.getElementById('productContainer');

      container.innerHTML = `
        <div class="image-box">
          <img src="${product.img}" alt="${product.name}" onerror="this.src='https://via.placeholder.com/400x400?text=Product+Image'">
        </div>

        <div class="content-box">
          <div class="brand-subtitle">${product.brand}</div>
          <h1 class="product-main-title">${product.name}</h1>

          <div class="price-row">
            <span class="price-amount">Php ${product.price}.00</span>
            <span class="stock-info">${product.stock} left &nbsp; MOQ for reseller : ${product.moq}</span>
          </div>

          <div class="qty-label">Quantity</div>
          <div class="action-row">
            <div class="quantity-control">
              <button class="qty-btn" onclick="updateQty(-1)">−</button>
              <input type="text" id="qtyInput" value="1" readonly class="qty-input">
              <button class="qty-btn" onclick="updateQty(1)">+</button>
            </div>
            <button class="add-to-cart-btn" onclick="addToCart()">Add to Cart</button>
          </div>

          <div class="sku-block">${product.sku}</div>
          <div class="spec-block">${product.specs}</div>

          <p class="product-description">${product.desc}</p>

          <div class="text-end">
            <span class="reviews-link">Reviews</span>
          </div>
        </div>
      `;
    }

    let currentQty = 1;

    function updateQty(change) {
      currentQty = Math.max(1, currentQty + change);
      document.getElementById('qtyInput').value = currentQty;
    }

    function addToCart() {
      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      const existingIndex = cart.findIndex(item => item.id === product.id);

      if (existingIndex > -1) {
        cart[existingIndex].quantity += currentQty;
      } else {
        cart.push({
          id: product.id,
          brand: product.brand,
          name: product.name,
          price: product.price,
          sku: product.sku,
          specs: product.specs,
          img: product.img,
          quantity: currentQty
        });
      }

      localStorage.setItem('cart', JSON.stringify(cart));
      window.dispatchEvent(new Event('cartUpdated'));

      const toast = document.getElementById('toast');
      toast.innerText = `Added ${product.name} to cart!`;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    renderDetail();
  </script>
</body>
</html>
