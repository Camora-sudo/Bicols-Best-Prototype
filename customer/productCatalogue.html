<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bicol's Best - Product Catalogue</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Remix Icon -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">

  <style>
    :root {
      --brand-red: #821b16;
      --brand-red-hover: #661410;
      --bg: #f8f9fa;
      --surface: #ffffff;
      --text: #1c1917;
      --text-muted: #78716c;
      --border: #e7e5e4;
      --radius: 8px;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding-bottom: 60px;
    }

    /* Page Heading */
    .page-title {
      color: var(--brand-red);
      font-weight: 700;
    }

    .product-card {
      display: block;
      text-decoration: none;
      color: inherit;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      background: var(--surface);
      text-align: center;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    .product-image-container img {
      max-width: 100%;
      height: 200px;
      object-fit: contain;
    }

    .product-title {
      font-weight: bold;
      margin-top: 15px;
      font-size: 0.95rem;
    }

    .product-price {
      color: var(--brand-red);
      font-weight: bold;
      margin-top: 5px;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <!-- Navbar Placeholder -->
  <div id="navbar-placeholder"></div>

  <div class="container mt-4">
    <h2 class="page-title mb-4">Product Catalogue</h2>
    
    <div class="d-flex justify-content-between mb-4">
       <div class="tabs">
         <button class="btn btn-outline-danger tab active" onclick="filterCategory('All', this)">All</button>
       </div>
       <input type="text" id="searchInput" class="form-control w-25 border-dark" placeholder="Search products..." onkeyup="handleSearch()">
    </div>

    <!-- Product Grid -->
    <div id="productGrid" class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-4"></div>
  </div>

  <script src="../navbar.js"></script>
  <script>

    const products = [
      { id: 1, name: "Bicol's Best Bicol Express Pork – 210g", price: 220, category: 'All', img: "../images/BE_Pork.png" },
      { id: 2, name: "Bicol's Best Bicol Express Tinapa – 210g", price: 220, category: 'All', img: "../images/BE_Tinapa.png" },
      { id: 3, name: "Bicol's Best Laing Regular – 226g", price: 168, category: 'All', img: "../images/Regular_Laing.png" },
      { id: 4, name: "Bicol's Best Laing Spicy – 226g", price: 168, category: 'All', img: "../images/Spicy_Laing.png" },
      { id: 5, name: "Bicol's Best Gulay na Santol Regular – 210g", price: 168, category: 'All', img: "../images/Regular_Santol.png" },
      { id: 6, name: "Bicol's Best Gulay na Santol Spicy – 210g", price: 168, category: 'All', img: "../images/Spicy_Santol.png" },
      { id: 7, name: "Bicol's Best Bicol Chili Paste – 100g", price: 168, category: 'All', img: "../images/Chili_Paste.png" },
      { id: 8, name: "Bicol's Best Very Special Pinangat Regular – 240g", price: 100, category: 'All', img: "../images/Regular_Pinangat.png" },
      { id: 9, name: "Bicol's Best Very Special Pinangat Spicy – 240g", price: 100, category: 'All', img: "../images/Spicy_Pinangat.png" }
    ];

    let currentCategory = 'All';

    function renderProducts(items) {
      const grid = document.getElementById('productGrid');
      if (items.length === 0) {
        grid.innerHTML = `<div class="text-center py-5 text-muted w-100">No products found matching your search.</div>`;
        return;
      }

      grid.innerHTML = items.map(p => `
        <div class="col">
          <a href="productDetails.html?id=${p.id}" class="product-card">
            <div class="product-image-container">
              <img src="${p.img}" alt="${p.name}" onerror="this.src='../images/logo.png'">
            </div>
            <div class="product-title">${p.name}</div>
            <div class="product-price">₱${p.price.toFixed(2)}</div>
          </a>
        </div>
      `).join('');
    }

    function filterCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      applyFilters();
    }

    function handleSearch() {
      applyFilters();
    }

    function applyFilters() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const filtered = products.filter(p => {
        const matchesCategory = (currentCategory === 'All') || (p.category === currentCategory);
        const matchesSearch = p.name.toLowerCase().includes(searchTerm);
        return matchesCategory && matchesSearch;
      });
      renderProducts(filtered);
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Check Role and Inject Banner if Reseller
      const currentRole = localStorage.getItem('role') || 'user';
      if (currentRole === 'reseller') {
          const banner = document.createElement('div');
          banner.className = 'bg-warning text-dark text-center py-2 fw-bold shadow-sm';
          banner.style.fontSize = '14px';
          banner.innerHTML = '⚠️ Reseller Mode Active: You must order a minimum of 48 assorted items to checkout.';
          document.body.insertBefore(banner, document.body.firstChild);
      }

      renderProducts(products);
    });
  </script>
</body>
</html>
