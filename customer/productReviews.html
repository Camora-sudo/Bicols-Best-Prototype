<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Reviews - Bicol's Best</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Remix Icon -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">

  <style>
    :root {
      --brand-red: #821b16;
      --brand-red-hover: #661410;
      --bg: #f8f9fa;
      --surface: #ffffff;
      --text: #1c1917;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --radius: 16px;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding-bottom: 60px;
    }

    .back-link {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
      display: inline-block;
      margin-bottom: 1.5rem;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--text); }

    .review-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      padding: 1.5rem;
      margin-bottom: 1rem;
    }

    .product-header-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      padding: 1.5rem;
    }

    .btn-submit-review {
      background: var(--brand-red);
      color: white;
      border: none;
      border-radius: 9999px;
      padding: 0.6rem 2rem;
      font-weight: 600;
      transition: background-color 0.2s;
    }
    .btn-submit-review:hover { background: var(--brand-red-hover); color: white; }

    .star-icon {
      color: #f59e0b; /* Amber / Gold star color */
    }

    .review-img-preview {
      max-height: 140px;
      border-radius: 8px;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <!-- Navbar Placeholder -->
  <div id="navbar-placeholder"></div>

  <div class="container mt-4">
    <!-- Dynamic Back Link -->
    <a id="backToProductBtn" href="#" class="back-link"><i class="ri-arrow-left-line me-1"></i> Back to Product Details</a>

    <!-- Product Header Summary -->
    <div class="product-header-card d-flex align-items-center gap-4 mb-4" id="productHeader">
      <!-- Injected via JS -->
    </div>

    <div class="row g-4">
      <!-- Left Column: Add Review Form -->
      <div class="col-lg-5">
        <div class="review-card">
          <h5 class="fw-bold mb-3"><i class="ri-edit-line me-1"></i> Leave a Review</h5>
          <form id="reviewForm">
            <div class="mb-3">
              <label class="form-label small fw-semibold">Rating (1 to 5 Stars)</label>
              <div class="d-flex align-items-center gap-2">
                <input type="number" id="reviewRating" class="form-control" min="1" max="5" value="5" required>
                <span class="text-muted fw-semibold"><i class="ri-star-fill star-icon"></i></span>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold">Comment (Max 50 characters)</label>
              <input type="text" id="reviewComment" class="form-control" maxlength="50" placeholder="Great flavor and authentic spice!" required>
            </div>

            <!-- File Upload Input -->
            <div class="mb-3">
              <label class="form-label small fw-semibold">Upload Photo (Optional)</label>
              <input type="file" id="reviewImageFile" class="form-control" accept="image/*">
            </div>

            <button type="submit" class="btn btn-submit-review w-100">Submit Review</button>
          </form>
        </div>
      </div>

      <!-- Right Column: Customer Reviews List -->
      <div class="col-lg-7">
        <h5 class="fw-bold mb-3"><i class="ri-chat-3-line me-1"></i> Customer Reviews</h5>
        <div id="reviewsContainer">
          <!-- Injected via JS -->
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../navbar.js"></script>

  <script>
    const products = [
      { id: 1, name: "Bicol's Best Bicol Express Pork – 210g", brand: "Bicol's Best", price: 220, img: "../images/BE_Pork.png" },
      { id: 2, name: "Bicol's Best Bicol Express Tinapa – 210g", brand: "Bicol's Best", price: 220, img: "../images/BE_Tinapa.png" },
      { id: 3, name: "Bicol's Best Laing Regular – 226g", brand: "Bicol's Best", price: 168, img: "../images/Regular_Laing.png" },
      { id: 4, name: "Bicol's Best Laing Spicy – 226g", brand: "Bicol's Best", price: 168, img: "../images/Spicy_Laing.png" },
      { id: 5, name: "Bicol's Best Gulay na Santol Regular – 210g", brand: "Bicol's Best", price: 168, img: "../images/Regular_Santol.png" },
      { id: 6, name: "Bicol's Best Gulay na Santol Spicy – 210g", brand: "Bicol's Best", price: 168, img: "../images/Spicy_Santol.png" },
      { id: 7, name: "Bicol's Best Bicol Chili Paste – 100g", brand: "Bicol's Best", price: 168, img: "../images/Chili_Paste.png" },
      { id: 8, name: "Bicol's Best Very Special Pinangat Regular – 240g", brand: "Bicol's Best", price: 100, img: "../images/Regular_Pinangat.png" },
      { id: 9, name: "Bicol's Best Very Special Pinangat Spicy – 240g", brand: "Bicol's Best", price: 100, img: "../images/Spicy_Pinangat.png" }
    ];

    const initialReviews = [
      { reviewId: 1, userId: 101, productId: 2, rating: 5, comment: "Super delicious! Authentic Bicol Express flavor.", imageLink: "" },
      { reviewId: 2, userId: 102, productId: 2, rating: 4, comment: "Spicy and perfect paired with hot rice.", imageLink: "" }
    ];

    if (!localStorage.getItem('reviews')) {
      localStorage.setItem('reviews', JSON.stringify(initialReviews));
    }

    const urlParams = new URLSearchParams(window.location.search);
    const productId = parseInt(urlParams.get('id')) || 2;
    const product = products.find(p => p.id === productId) || products[1];

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('backToProductBtn').href = `productDetails.html?id=${product.id}`;

      document.getElementById('productHeader').innerHTML = `
        <img src="${product.img}" alt="${product.name}" onerror="this.src='../images/logo.png'" style="width: 80px; height: 80px; object-fit: contain;">
        <div>
          <span class="text-muted small text-uppercase fw-bold">${product.brand}</span>
          <h4 class="fw-bold mb-0">${product.name}</h4>
          <span class="text-danger fw-bold fs-5">₱${product.price.toFixed(2)}</span>
        </div>
      `;

      renderReviews();
    });

    function renderStars(rating) {
      let starsHtml = '';
      // Caps star generation between 1 and 5
      const validRating = Math.min(5, Math.max(1, rating));
      for (let i = 1; i <= 5; i++) {
        if (i <= validRating) {
          starsHtml += `<i class="ri-star-fill star-icon"></i>`;
        } else {
          starsHtml += `<i class="ri-star-line text-muted opacity-50"></i>`;
        }
      }
      return starsHtml;
    }

    function renderReviews() {
      const allReviews = JSON.parse(localStorage.getItem('reviews')) || [];
      const productReviews = allReviews.filter(r => r.productId === product.id);
      const container = document.getElementById('reviewsContainer');

      if (productReviews.length === 0) {
        container.innerHTML = `
          <div class="review-card text-center text-muted py-4">
            No reviews for this product yet. Use the form to write the first review!
          </div>`;
        return;
      }

      container.innerHTML = productReviews.map(r => `
        <div class="review-card">
          <div class="d-flex align-items-center mb-2">
            <div>${renderStars(r.rating)}</div>
          </div>
          <p class="mb-1 text-dark fw-medium">${r.comment}</p>
          ${r.imageLink ? `<img src="${r.imageLink}" class="review-img-preview border mt-2" alt="Uploaded Review Image">` : ''}
        </div>
      `).join('');
    }

    // Helper function to read uploaded image as Base64 String
    function convertFileToBase64(file) {
      return new Promise((resolve, reject) => {
        if (!file) {
          resolve('');
          return;
        }
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }

    // Handle Form Submit
    document.getElementById('reviewForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      let rating = parseInt(document.getElementById('reviewRating').value);
      rating = Math.min(5, Math.max(1, rating));

      const comment = document.getElementById('reviewComment').value.trim();
      const fileInput = document.getElementById('reviewImageFile');
      const selectedFile = fileInput.files[0];

      const imageBase64 = await convertFileToBase64(selectedFile);

      const allReviews = JSON.parse(localStorage.getItem('reviews')) || [];

      const newReview = {
        reviewId: Date.now(),
        userId: null,
        productId: product.id,
        rating: rating,
        comment: comment,
        imageLink: imageBase64
      };

      allReviews.push(newReview);
      localStorage.setItem('reviews', JSON.stringify(allReviews));

      this.reset();
      document.getElementById('reviewRating').value = 5;
      renderReviews();
    });
  </script>
</body>
</html>
