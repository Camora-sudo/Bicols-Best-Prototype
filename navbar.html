<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Remix Icon -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>

<header class="py-3 sticky-top" style="background-color:#821b16;">
  <div class="container-fluid px-4">
    <div class="d-flex justify-content-between align-items-center" id="navbar-content">
      <!-- filled in by JS -->
    </div>
  </div>

  <style>
    #navbar-content .nav-link {
    transition: color 0.2s ease, opacity 0.2s ease;
    }

    #navbar-content .nav-link:hover {
      opacity: 0.8;
    }

    #navbar-content .nav-link.active {
      font-weight: 700;
    }
    </style>
</header>

<script>
  const URL = '/Bicols-Best-Prototype';

  function getCookie(name) {
    const match = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
    return match ? decodeURIComponent(match[2]) : null;
  }

  function deleteCookie(name) {
    document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
  }

  function renderNavbar() {
    const role = getCookie('role');
    const container = document.getElementById('navbar-content');

    if (role === 'user') {
      container.innerHTML = `
        <div class="d-flex align-items-center">
          <a href="${URL}/customer/productCatalogue.html" class="d-flex align-items-center text-white text-decoration-none">
            <img src="${URL}/images/logo.png" width="130" class="d-inline-block align-text-top" alt="Bicol's Best">
            <span class="fw-bold fs-5 d-none d-md-inline mx-3">Bicol's Best Served Online</span>
          </a>
        </div>
        <div class="d-flex align-items-center">
          <nav class="d-none d-md-flex align-items-center me-4">
            <a href="${URL}/customer/productCatalogue.html" class="nav-link text-white mx-3">Products</a>
            <a href="${URL}/customer/userProfile.html" class="nav-link text-white mx-3">Profile</a>
            <a href="${URL}/customer/contactPage.html" class="nav-link text-white mx-3">Contact Us</a>
            <a href="#" id="logout-link" class="nav-link text-white mx-3 me-4">Logout</a>
            <a href="${URL}/customer/shoppingCart.html" class="text-white fs-3">
              <i class="ri-shopping-cart-2-line"></i>
            </a>
          </nav>
        </div>
      `;

      document.getElementById('logout-link').addEventListener('click', function(e) {
        e.preventDefault();
        logout();
      });
    } else if (role === 'admin') {
      container.innerHTML = `
        <div class="d-flex align-items-center">
          <a href="${URL}/admin/dashboard.html" class="d-flex align-items-center text-white text-decoration-none">
            <img src="${URL}/images/logo.png" width="130" class="d-inline-block align-text-top" alt="Bicol's Best">
            <span class="fw-bold fs-5 d-none d-md-inline mx-3">Bicol's Best Served Online</span>
          </a>
        </div>
        <div class="d-flex align-items-center">
          <nav class="d-none d-md-flex align-items-center me-4">
            <a href="${URL}/admin/orderManagement.html" class="nav-link text-white mx-3">Orders</a>
            <a href="${URL}/admin/productManagement.php" class="nav-link text-white mx-3">Products</a>
            <a href="${URL}/admin/staffManagement.html" class="nav-link text-white mx-3">Staff</a>
            <a href="${URL}/admin/userManagement.html" class="nav-link text-white mx-3">Users</a>
            <a href="#" id="logout-link" class="nav-link text-white mx-3">Logout</a>
          </nav>
        </div>
      `;

      document.getElementById('logout-link').addEventListener('click', function(e) {
        e.preventDefault();
        logout();
      });
    }
    else {
      container.innerHTML = `
        <div class="d-flex align-items-center">
          <a href="${URL}/customer/productCatalogue.html" class="d-flex align-items-center text-white text-decoration-none">
            <img src="${URL}/images/logo.png" width="130" class="d-inline-block align-text-top" alt="Bicol's Best">
            <span class="fw-bold fs-5 d-none d-md-inline mx-3">Bicol's Best Served Online</span>
          </a>
        </div>
        <div class="d-flex align-items-center">
          <nav class="d-none d-md-flex align-items-center me-4">
            <a href="${URL}/customer/productCatalogue.html" class="nav-link text-white mx-3">Products</a>
            <a href="${URL}/public/login.html" class="text-white fs-3"></a>
          </nav>
        </div>
      `;

      document.getElementById('logout-link').addEventListener('click', function(e) {
        e.preventDefault();
        logout();
      });
    }
  }

  function logout() {
    deleteCookie('role');
    window.location.href = `${URL}/index.html`;
  }

  function highlightCurrentPage() {
  const currentPage = window.location.pathname.split('/').pop();

  document.querySelectorAll('#navbar-content .nav-link').forEach(link => {
    const linkPage = link.getAttribute('href').split('/').pop();

    if (linkPage === currentPage) {
      link.classList.add('active');
    }
  });
}

  highlightCurrentPage();

  renderNavbar();

</script>

</body>
</html>
