<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Navbar placeholder -->
  <div id="navbar-placeholder"></div>

  <!-- Login Section -->
  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-4">
        <div class="card shadow-lg p-4 rounded" style="backdrop-filter: blur(10px); background: rgba(255,255,255,0.9);">
          <h2 class="text-center mb-4">Login</h2>
          <form onsubmit="login(event)">
            <!-- Email -->
            <div class="mb-3">
              <label for="email" class="form-label">Email Address</label>
              <input type="email" class="form-control rounded-pill" id="email" required>
            </div>

            <!-- Password -->
            <div class="mb-3 position-relative">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control rounded-pill pe-5" id="password" required>
              <button type="button" class="btn btn-sm btn-link position-absolute top-50 end-0 translate-middle-y me-2" onclick="togglePassword()">👁</button>
              <a href="forgot-password.html" class="d-block mt-2 text-decoration-underline text-danger">Forgot password?</a>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn btn-danger w-100 rounded-pill">Login</button>
          </form>

          <!-- Signup Link -->
          <div class="text-center mt-3">
            <a href="register.html" class="text-decoration-underline text-danger">Don't have an account yet? Sign up here</a>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    const passwordField = document.getElementById("password");
    function togglePassword() {
      if (passwordField.type === "password") {
        passwordField.type = "text";
      } else {
        passwordField.type = "password";
      }
    }
  // TEST ONLY simulates a logged-in user; palitan nyo nalang role to user or admin
  function login(event) {

  event.preventDefault();

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  if (
    email === "admin@bicolsbest.com" &&
    password === "Admin123!"
  ) {

    document.cookie = "role=admin; path=/; max-age=86400";

    window.location.href = "../admin/dashboard.html";

    return;
  }

  document.cookie = "role=user; path=/; max-age=86400";

  window.location.href = "productCatalogue.html";
}
    fetch('../navbar.html')
      .then(res => res.text())
      .then(html => {
        const placeholder = document.getElementById('navbar-placeholder');
        placeholder.innerHTML = html;
 
        const oldScripts = placeholder.querySelectorAll('script');
        oldScripts.forEach(oldScript => {
          const newScript = document.createElement('script');
          if (oldScript.src) {
            newScript.src = oldScript.src;
          } else {
            newScript.textContent = oldScript.textContent;
          }
          document.body.appendChild(newScript);
        });
      });
  </script>
</body>
</html>
