<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Login Page</title>
  <style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #f8f8f8;
        font-family: Arial, sans-serif;
    }

    .login-box {
        backdrop-filter: blur(10px);
        background: rgba(255, 255, 255, 0.7);
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        width: 300px;
    }

    .login-box h2 {
        text-align: center;
        margin-bottom: 20px;
    }

    .input-group {
        position: relative;
        margin-bottom: 20px;
    }

    .input-group input {
        width: 80%;
        padding: 10px 40px 10px 15px;
        border: 1px solid #ccc;
        border-radius: 25px;
        outline: none;
        font-size: 14px;
    }

    .input-group button {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-15%);
        border: none;
        background: none;
        cursor: pointer;
        font-size: 14px;
    }

    .login-box button.submit-btn {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 25px;
        background-color: #821b16;
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }

    .login-box button.submit-btn:hover {
        background-color: #a3231c;
    }

    .signup-link {
        display: block;
        margin-top: 15px;
        font-size: 14px;
        color: #821b16;
        text-decoration: none;
        transition: color 0.3s ease;
        text-decoration: underline;
    }

    .signup-link:hover {
        color: #e72b21;
    }

  </style>
</head>
<body>
  <div class="login-box">
    <h2>Hello!</h2>
    <form>
      <div>
        <p>Login into your account</p>
      </div>
      <div class="input-group">
        <label for="email">Email Address</label>
        <input type="text" required>
      </div>
      <div class="input-group">
        <label for="email">Password</label>
        <input type="password" id="password" required>
        <button type="button" onclick="togglePassword()">👁</button>
      </div>
      <button type="submit" class="submit-btn">Login</button>
    </form>
    <a href="#" class="signup-link">Don't have an account yet? Sign up here</a>
  </div>

  <script>
    function togglePassword() {
      const passwordField = document.getElementById("password");
      if (passwordField.type === "password") {
        passwordField.type = "text";
      } else {
        passwordField.type = "password";
      }
    }
  </script>
</body>
</html>
