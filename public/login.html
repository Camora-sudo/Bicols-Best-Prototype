<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Navbar placeholder -->
  <div id="navbar-placeholder"></div>

  <!-- Login Section -->
  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-4">
        <div class="card shadow-lg p-4 rounded" style="backdrop-filter: blur(10px); background: rgba(255,255,255,0.9);">
          <h2 class="text-center mb-4">Login</h2>
          <form id="loginForm">
            <!-- Email -->
            <div class="mb-3">
              <label for="email" class="form-label">Email Address</label>
              <input type="email" class="form-control rounded-pill" id="email" required>
            </div>

            <!-- Password -->
            <div class="mb-3 position-relative">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control rounded-pill pe-5" id="password" required>
              <button type="button" class="btn btn-sm btn-link position-absolute top-50 end-0 translate-middle-y me-2" onclick="togglePassword()">👁</button>
              <a href="forgot-password.html" class="d-block mt-2 text-decoration-underline text-danger">Forgot password?</a>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn btn-danger w-100 rounded-pill">Login</button>
          </form>

          <!-- Mock Accounts Cheat Sheet for Demo -->
          <div class="alert alert-warning mt-4 p-3 rounded" style="font-size: 0.85rem;">
            <strong>🧪 Mock Accounts for Testing:</strong><br>
            <ul class="mb-0 mt-1 ps-3">
              <li><strong>Admin:</strong> <code>admin@bicolsbest.com / bic0lsb3st@dm!n</code></li>
              <li><strong>Reseller:</strong> <code>reseller@bicolsbest.com / bic0lsb3stres311eR</code></li>
              <li><strong>User:</strong> <code>user@gmail.com / bic0lsb3stU$er</code></li>
            </ul>
            <span class="text-muted mt-2 d-block" style="font-size: 0.75rem;">*Password can be anything for the demo.</span>
          </div>

          <!-- Signup Link -->
          <div class="text-center mt-3">
            <a href="register.html" class="text-decoration-underline text-danger">Don't have an account yet? Sign up here</a>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
    const passwordField = document.getElementById("password");
    function togglePassword() {
      if (passwordField.type === "password") {
        passwordField.type = "text";
      } else {
        passwordField.type = "password";
      }
    }

    // WIPE OLD DATA WHEN VISITING LOGIN PAGE
    localStorage.removeItem('role');
    document.cookie = "role=; path=/; max-age=86400";

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault(); // Stop the form from refreshing the page!

      const passwordField = document.getElementById("password");
      const email = document.getElementById('email').value.toLowerCase();
      let role = 'user'; // default


      // Check password
      if((passwordField === "bic0lsb3st@dm!n" && email === "admin@bicolsbest.com")
          || (passwordField === "bic0lsb3stres311eR" && email === "reseller@bicolsbest.com")
          || (passwordField === "bic0lsb3stU$er" && email === "user@gmail.com")
      ){
        alert("Email and/or password is not correct.");
        return;
      }

      // Check the email to assign the mock role
      if (email.includes('admin')) {
        role = 'admin';
      } else if (email.includes('reseller')) {
        role = 'reseller';
      }

      // THE CRITICAL FIX: Save the role to localStorage so navbar.js can actually read it!
      localStorage.setItem('role', role);
      
      // Also set the cookie as a backup
      document.cookie = "role=" + role + "; path=/; max-age=86400";

      // Redirect based on the newly set role
      if (role === 'admin') {
        window.location.href = '../admin/dashboard.html';
      } else {
        window.location.href = '../customer/productCatalogue.html';
      }
    });

    // Load Navbar via navbar.js
    const script = document.createElement('script');
    script.src = '../navbar.js';
    document.body.appendChild(script);
  </script>
</body>
</html>
