<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password</title>
  <style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #f8f8f8;
        font-family: Arial, sans-serif;
    }

    .forgot-box {
        backdrop-filter: blur(10px);
        background: rgba(255, 255, 255, 0.7);
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        width: 300px;
    }

    .forgot-box h2 {
        text-align: center;
        margin-bottom: 50px;
    }

    .input-group {
        margin-bottom: 20px;
    }

    .input-group input {
        width: 90%;
        padding: 10px 15px;
        border: 1px solid #ccc;
        border-radius: 25px;
        outline: none;
        font-size: 14px;
    }

    .forgot-box button.submit-btn {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 25px;
        background-color: #821b16;
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }

    .forgot-box button.submit-btn:hover {
        background-color: #a3231c;
    }

    .back-link {
        display: block;
        margin-top: 15px;
        font-size: 14px;
        color: #821b16;
        text-decoration: underline;
        transition: color 0.3s ease;
        text-align: center;
    }

    .back-link:hover {
        color: #e72b21;
    }
  </style>
</head>
<body>
  <div class="forgot-box">
    <h2>Forgot Password</h2>
    <form onsubmit="sendCode(event)">
      <div class="input-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" required>
      </div>
      <button type="submit" class="submit-btn">Send Recovery Link</button>
    </form>
    <a href="login.html" class="back-link">Back to Login</a>
  </div>

  <script>
    function sendCode(event) {
      event.preventDefault();
      const email = document.getElementById("email").value;
      if (email) {
        // Mock code generation
        alert("A link has been sent to " + email + ". Please also check the spam/junk folder.");
      }
    }
  </script>
</body>
</html>
