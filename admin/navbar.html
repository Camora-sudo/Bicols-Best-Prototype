```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Remix Icon -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">

  <style>
    :root {
      --brand-red: #821b16;
      --brand-red-hover: #661410;
      --text: #1c1917;
      --surface: #ffffff;
      --border: #e7e5e4;
    }

    /* Admin Navbar */
    .admin-navbar {
      background-color: var(--surface);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .admin-navbar .navbar-brand {
      color: var(--brand-red);
      font-weight: 800;
      font-size: 1.3rem;
    }

    .admin-navbar .navbar-brand:hover {
      color: var(--brand-red-hover);
    }

    /* Navigation Links */
    .admin-navbar .nav-link {
      color: var(--text);
      font-weight: 600;
      padding: 10px 14px;
      border-radius: 8px;
    }

    .admin-navbar .nav-link:hover {
      color: var(--brand-red);
      background-color: #f8eeee;
    }

    .admin-navbar .nav-link.active {
      color: var(--brand-red);
      background-color: #f8eeee;
    }

    .admin-navbar .nav-link i {
      margin-right: 5px;
      font-size: 1.05rem;
    }

    /* Admin Label */
    .admin-label {
      color: var(--brand-red);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* Admin Profile */
    .admin-profile {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      font-weight: 600;
    }

    .admin-profile i {
      color: var(--brand-red);
      font-size: 1.4rem;
    }

    /* Mobile */
    @media (max-width: 991px) {

      .admin-navbar .nav-link {
        margin-top: 4px;
      }

      .admin-profile {
        margin-top: 10px;
        padding: 10px 14px;
      }

    }
  </style>
</head>

<body>

  <!-- Admin Navbar -->
  <nav class="navbar navbar-expand-lg admin-navbar">

    <div class="container">

      <!-- Brand -->
      <a class="navbar-brand" href="dashboard.html">
        Bicol's Best
        <span class="admin-label d-block">
          Admin
        </span>
      </a>

      <!-- Mobile Toggle -->
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#adminNavbar"
        aria-controls="adminNavbar"
        aria-expanded="false"
        aria-label="Toggle navigation">

        <i class="ri-menu-line"></i>

      </button>

      <!-- Navigation -->
      <div class="collapse navbar-collapse" id="adminNavbar">

        <ul class="navbar-nav ms-auto align-items-lg-center">

          <li class="nav-item">
            <a class="nav-link" href="dashboard.html">
              <i class="ri-dashboard-line"></i>
              Dashboard
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="orderManagement.html">
              <i class="ri-shopping-bag-3-line"></i>
              Orders
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="productManagement.html">
              <i class="ri-box-3-line"></i>
              Products
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="staffManagement.html">
              <i class="ri-team-line"></i>
              Staff
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="userManagement.html">
              <i class="ri-user-line"></i>
              Users
            </a>
          </li>

          <!-- Admin Profile -->
          <li class="nav-item ms-lg-3">

            <div class="admin-profile">

              <i class="ri-admin-line"></i>

              <span>
                Admin
              </span>

            </div>

          </li>

        </ul>

      </div>

    </div>

  </nav>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Highlight Current Page
    const currentPage = window.location.pathname.split('/').pop();

    document.querySelectorAll('.admin-navbar .nav-link').forEach(link => {

      const linkPage = link.getAttribute('href');

      if (linkPage === currentPage) {
        link.classList.add('active');
      }

    });
  </script>

</body>
</html>
```
