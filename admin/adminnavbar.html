<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap 5 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <!-- Remix Icon -->
  <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
    rel="stylesheet">

  <style>

    :root {
      --brand-red: #821b16;
      --brand-red-hover: #661410;
      --navbar-bg: #821b16;
      --text: #ffffff;
      --border: #821b16;
    }


    /* Admin Navbar */

    .admin-navbar {
      background-color: #821b16;
      border-bottom: 1px solid #821b16;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      min-height: 85px;
    }


    /* Brand */

    .admin-navbar .navbar-brand {
      color: #ffffff;
      font-weight: 700;
      font-size: 1.5rem;
      line-height: 1.1;

      display: flex;
      align-items: center;
      gap: 22px;
    }


    .admin-navbar .navbar-brand:hover {
      color: #ffffff;
    }


    /* Brand Logo */

    .admin-navbar .navbar-brand img {
      width: 155px;
      height: auto;
      object-fit: contain;
    }


    /* Navigation Links */

    .admin-navbar .nav-link {
      color: #ffffff;
      font-weight: 500;
      font-size: 1.1rem;

      padding: 10px 14px;
      border-radius: 10px;

      transition: 0.2s ease;
    }


    .admin-navbar .nav-link:hover {
      color: #ffffff;
      background-color: rgba(255, 255, 255, 0.10);
    }


    .admin-navbar .nav-link.active {
      color: #ffffff;
      background-color: rgba(255, 255, 255, 0.10);
    }


    /* Navigation Icons */

    .admin-navbar .nav-link i {
      margin-right: 6px;
      font-size: 1.1rem;
      vertical-align: middle;
    }


    /* Mobile Menu Button */

    .admin-navbar .navbar-toggler {
      border: none;
      color: #ffffff;
      font-size: 1.5rem;
    }


    .admin-navbar .navbar-toggler:focus {
      box-shadow: none;
    }


    /* Mobile */

    @media (max-width: 991px) {

      .admin-navbar .nav-link {
        margin-top: 4px;
      }

      .admin-navbar .navbar-brand {
        font-size: 1.2rem;
      }

      .admin-navbar .navbar-brand img {
        width: 120px;
      }

    }

  </style>
</head>

<body>

  <!-- Admin Navbar -->

  <nav class="navbar navbar-expand-lg admin-navbar">

    <div class="container">

      <!-- Brand -->

      <a
        class="navbar-brand"
        href="dashboard.html">

        <img
          src="../images/logo.png"
          alt="Bicol's Best Logo">

        <span>
          Bicol's Best Served Online
        </span>

      </a>


      <!-- Mobile Toggle -->

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#adminNavbar"
        aria-controls="adminNavbar"
        aria-expanded="false"
        aria-label="Toggle navigation">

        <i class="ri-menu-line"></i>

      </button>


      <!-- Navigation -->

      <div
        class="collapse navbar-collapse"
        id="adminNavbar">

        <ul class="navbar-nav ms-auto align-items-lg-center">


          <!-- Orders -->

          <li class="nav-item">

            <a
              class="nav-link"
              href="orderManagement.html">

              <i class="ri-shopping-bag-3-line"></i>
              Orders

            </a>

          </li>


          <!-- Products -->

          <li class="nav-item">

            <a
              class="nav-link"
              href="productManagement.html">

              <i class="ri-box-3-line"></i>
              Products

            </a>

          </li>


          <!-- Staff -->

          <li class="nav-item">

            <a
              class="nav-link"
              href="staffManagement.html">

              <i class="ri-team-line"></i>
              Staff

            </a>

          </li>


          <!-- Users -->

          <li class="nav-item">

            <a
              class="nav-link"
              href="userManagement.html">

              <i class="ri-user-line"></i>
              Users

            </a>

          </li>


          <!-- Logout -->

          <li class="nav-item">

            <a
              class="nav-link"
              href="../public/login.html">

              <i class="ri-logout-box-r-line"></i>
              Logout

            </a>

          </li>


        </ul>

      </div>

    </div>

  </nav>


  <!-- Bootstrap JS -->

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js">
  </script>


  <script>

    // Highlight Current Page

    const currentPage =
      window.location.pathname
        .split('/')
        .pop();


    document
      .querySelectorAll('.admin-navbar .nav-link')
      .forEach(link => {

        const linkPage =
          link.getAttribute('href');


        if (linkPage === currentPage) {

          link.classList.add('active');

        }

      });

  </script>

</body>
</html>
